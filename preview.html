<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Multi-Crop GC - Scan Inspector & Editor</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Sidebar Styles */
    #sidebar {
      width: 340px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .filter-bar {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .scan-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .scan-item {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background-color: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }

    .scan-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .scan-item.active {
      background-color: var(--bg-card);
      border-color: var(--accent);
    }

    .scan-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .scan-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-secondary {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { background-color: var(--border-color); }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background-color: var(--danger); color: white; }

    /* Main Viewport */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .toolbar {
      height: 56px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      background-color: #020617;
      overflow: hidden;
      cursor: grab;
    }

    .canvas-container.grabbing { cursor: grabbing; }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Status Toast */
    #toast {
      position: absolute;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      background-color: #1e293b;
      color: #fff;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 13px;
      display: none;
      z-index: 1000;
    }

    /* Info Card */
    .info-card {
      position: absolute;
      top: 70px;
      right: 20px;
      width: 280px;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      font-size: 12px;
      z-index: 100;
    }

    .info-card h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .info-row span.val {
      color: var(--text-main);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Auto Multi-Crop GC</h1>
      <p>Sub-Pixel Photo Scan Segmenter</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all')">All Scans</button>
      <button class="filter-btn" onclick="setFilter('flagged')">Flagged</button>
    </div>

    <div class="scan-list" id="scan-list">
      <!-- Dynamic Scan List -->
    </div>

    <div class="sidebar-footer">
      <button class="btn btn-secondary" onclick="undo()" id="undo-btn" title="Keyboard shortcut: Ctrl+Z">
        ↩️ Undo
      </button>
      <button class="btn btn-secondary" onclick="saveJsonOnly()">
        💾 Save JSON Only
      </button>
      <button class="btn btn-secondary" onclick="exportDebugOverlays()">
        🖼️ Export Debug Overlays
      </button>
      <button class="btn btn-secondary" onclick="autoRotateAll()">
        🤖 Auto-Rotate All
      </button>
      <button class="btn btn-primary" onclick="saveAndRecrop()">
        ✂️ Save & Re-Crop All Photos
      </button>
    </div>
  </div>

  <!-- Main View -->
  <div id="main-content">
    <div class="toolbar">
      <div class="toolbar-title" id="current-scan-title">Select a scan</div>
      <div class="toolbar-actions">
        <button class="btn btn-secondary" onclick="undo()" title="Undo (Ctrl+Z)">↩️ Undo</button>
        <button class="btn btn-secondary" onclick="addPhotoCrop()">➕ Add Crop</button>
        <button class="btn btn-danger" onclick="deleteSelectedCrop()">🗑️ Delete</button>
        <button class="btn btn-secondary" onclick="zoomIn()">🔍+</button>
        <button class="btn btn-secondary" onclick="zoomOut()">🔍-</button>
        <button class="btn btn-secondary" onclick="resetZoom()">Fit</button>
      </div>
    </div>

    <div class="canvas-container" id="canvas-container">
      <canvas id="cropCanvas"></canvas>

      <!-- Selection Info Card -->
      <div class="info-card" id="info-card" style="display: none;">
        <h3 id="info-photo-id">Photo Details</h3>
        <img id="info-crop-thumb" style="width: 100%; height: 120px; object-fit: contain; border-radius: 6px; margin: 8px 0; background: #000; border: 1px solid var(--border-color);" alt="Crop Preview">
        <div class="info-row"><span>Status:</span> <span class="val" id="info-status">OK</span></div>
        <div class="info-row"><span>Size:</span> <span class="val" id="info-size">0 x 0 px</span></div>
        <div class="info-row"><span>Aspect Ratio:</span> <span class="val" id="info-aspect">1.0</span></div>
        <div class="info-row" id="info-flag-row" style="display: none; color: var(--warning);">
          <span>Flag Reason:</span> <span class="val" id="info-flag-reason">-</span>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 10px;">
          <button class="btn btn-secondary" style="flex: 1; font-size: 11px; padding: 6px;" onclick="rotateSelectedPhoto(90)">🔄 90° CW</button>
          <button class="btn btn-secondary" style="flex: 1; font-size: 11px; padding: 6px;" onclick="rotateSelectedPhoto(-90)">↺ 90° CCW</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    let manifestData = { scans: {} };
    let currentScanName = null;
    let scanImage = new Image();
    let imageLoaded = false;

    // Undo History Stack
    let historyStack = [];

    // Viewport Transformation (Pan & Zoom)
    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0, startPanY = 0;

    // Selection & Drag State
    let selectedPhotoIdx = -1;
    let draggingHandleIdx = -1;
    let currentFilter = 'all';

    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function saveStateToHistory() {
      if (historyStack.length > 25) historyStack.shift();
      historyStack.push(JSON.stringify(manifestData));
    }

    function undo() {
      if (historyStack.length === 0) {
        showToast('Nothing to undo');
        return;
      }
      const prevState = historyStack.pop();
      manifestData = JSON.parse(prevState);
      renderScanList();
      draw();
      showToast('↩️ Undid last edit');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undo();
      }
    });

    async function loadManifest() {
      try {
        const res = await fetch('/api/manifest');
        manifestData = await res.json();
        renderScanList();

        const scanNames = Object.keys(manifestData.scans);
        if (scanNames.length > 0) {
          selectScan(scanNames[0]);
        }
      } catch (err) {
        showToast('Failed to load manifest: ' + err.message);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderScanList();
    }

    function renderScanList() {
      const listEl = document.getElementById('scan-list');
      listEl.innerHTML = '';

      Object.keys(manifestData.scans).forEach(name => {
        const scan = manifestData.scans[name];
        const isFlagged = scan.photos.some(p => p.flagged);

        if (currentFilter === 'flagged' && !isFlagged) return;

        const item = document.createElement('div');
        item.className = `scan-item ${name === currentScanName ? 'active' : ''}`;
        item.onclick = () => selectScan(name);

        const badgeClass = isFlagged ? 'badge-warning' : 'badge-success';
        const badgeText = isFlagged ? 'FLAGGED' : `${scan.photos.length} Photos`;

        item.innerHTML = `
          <div>
            <div class="scan-name">${name}</div>
            <div class="scan-meta">${scan.width} x ${scan.height} px</div>
          </div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        `;
        listEl.appendChild(item);
      });
    }

    function selectScan(name) {
      currentScanName = name;
      selectedPhotoIdx = -1;
      imageLoaded = false;
      renderScanList();

      document.getElementById('current-scan-title').innerText = `${name} (${manifestData.scans[name].photos.length} Photos)`;

      scanImage = new Image();
      scanImage.onload = () => {
        imageLoaded = true;
        resetZoom();
      };
      scanImage.src = `/api/image?name=${encodeURIComponent(name)}`;
    }

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function resetZoom() {
      if (!imageLoaded) return;
      resizeCanvas();
      const containerW = container.clientWidth;
      const containerH = container.clientHeight;

      scale = Math.min(containerW / scanImage.width, containerH / scanImage.height) * 0.92;
      panX = (containerW - scanImage.width * scale) / 2;
      panY = (containerH - scanImage.height * scale) / 2;
      draw();
    }

    function zoomIn() { scale *= 1.2; draw(); }
    function zoomOut() { scale /= 1.2; draw(); }

    function imgToCanvas(x, y) {
      return { x: x * scale + panX, y: y * scale + panY };
    }
    function canvasToImg(x, y) {
      return { x: (x - panX) / scale, y: (y - panY) / scale };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!imageLoaded || !currentScanName) return;

      ctx.drawImage(scanImage, panX, panY, scanImage.width * scale, scanImage.height * scale);
      const scan = manifestData.scans[currentScanName];

      scan.photos.forEach((photo, pIdx) => {
        const isSelected = pIdx === selectedPhotoIdx;
        const corners = photo.corners.map(c => imgToCanvas(c[0], c[1]));

        ctx.beginPath();
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < 4; i++) {
          ctx.lineTo(corners[i].x, corners[i].y);
        }
        ctx.closePath();

        if (isSelected) {
          ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
        } else if (photo.flagged) {
          ctx.fillStyle = 'rgba(245, 158, 11, 0.18)';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
        } else {
          ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 1;
        }
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = isSelected ? '#38bdf8' : (photo.flagged ? '#f59e0b' : '#22c55e');
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`Photo ${pIdx + 1}`, corners[0].x + 8, corners[0].y - 8);

        corners.forEach((pt) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, isSelected ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? '#ffffff' : (photo.flagged ? '#f59e0b' : '#22c55e');
          ctx.fill();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      });

      updateInfoCard();
    }

    function updateInfoCard() {
      const card = document.getElementById('info-card');
      if (selectedPhotoIdx < 0 || !currentScanName) {
        card.style.display = 'none';
        return;
      }
      const photo = manifestData.scans[currentScanName].photos[selectedPhotoIdx];
      card.style.display = 'block';

      document.getElementById('info-photo-id').innerText = photo.id;
      document.getElementById('info-status').innerText = photo.flagged ? 'FLAGGED' : 'VALID';
      document.getElementById('info-status').style.color = photo.flagged ? 'var(--warning)' : 'var(--success)';

      const thumb = document.getElementById('info-crop-thumb');
      if (thumb) {
        thumb.src = `/api/cropped_image?id=${encodeURIComponent(photo.id)}&t=${Date.now()}`;
      }

      const c = photo.corners;
      const w = Math.round(Math.hypot(c[1][0] - c[0][0], c[1][1] - c[0][1]));
      const h = Math.round(Math.hypot(c[3][0] - c[0][0], c[3][1] - c[0][1]));
      document.getElementById('info-size').innerText = `${w} x ${h} px`;
      document.getElementById('info-aspect').innerText = (Math.max(w,h) / Math.min(w,h)).toFixed(2);

      const flagRow = document.getElementById('info-flag-row');
      if (photo.flagged && photo.flag_reasons.length > 0) {
        flagRow.style.display = 'flex';
        document.getElementById('info-flag-reason').innerText = photo.flag_reasons.join(', ');
      } else {
        flagRow.style.display = 'none';
      }
    }

    container.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (!currentScanName) return;
      const scan = manifestData.scans[currentScanName];

      for (let pIdx = 0; pIdx < scan.photos.length; pIdx++) {
        const corners = scan.photos[pIdx].corners;
        for (let hIdx = 0; hIdx < 4; hIdx++) {
          const pt = imgToCanvas(corners[hIdx][0], corners[hIdx][1]);
          if (Math.hypot(mouseX - pt.x, mouseY - pt.y) <= 10) {
            saveStateToHistory();
            selectedPhotoIdx = pIdx;
            draggingHandleIdx = hIdx;
            draw();
            return;
          }
        }
      }

      for (let pIdx = 0; pIdx < scan.photos.length; pIdx++) {
        const corners = scan.photos[pIdx].corners.map(c => imgToCanvas(c[0], c[1]));
        if (pointInPolygon({ x: mouseX, y: mouseY }, corners)) {
          selectedPhotoIdx = pIdx;
          draw();
          return;
        }
      }

      isPanning = true;
      startPanX = mouseX - panX;
      startPanY = mouseY - panY;
      container.classList.add('grabbing');
    });

    container.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (draggingHandleIdx >= 0 && selectedPhotoIdx >= 0) {
        const imgPt = canvasToImg(mouseX, mouseY);
        manifestData.scans[currentScanName].photos[selectedPhotoIdx].corners[draggingHandleIdx] = [
          Math.round(imgPt.x * 100) / 100,
          Math.round(imgPt.y * 100) / 100
        ];
        draw();
      } else if (isPanning) {
        panX = mouseX - startPanX;
        panY = mouseY - startPanY;
        draw();
      }
    });

    container.addEventListener('mouseup', () => {
      isPanning = false;
      draggingHandleIdx = -1;
      container.classList.remove('grabbing');
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale *= zoomFactor;
      draw();
    });

    function pointInPolygon(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function addPhotoCrop() {
      if (!currentScanName) return;
      saveStateToHistory();
      const scan = manifestData.scans[currentScanName];
      const cx = scan.width / 2;
      const cy = scan.height / 2;
      const w = 1200;
      const h = 800;

      const newCorners = [
        [cx - w/2, cy - h/2],
        [cx + w/2, cy - h/2],
        [cx + w/2, cy + h/2],
        [cx - w/2, cy + h/2]
      ];

      const newPhoto = {
        id: `${currentScanName.replace(/\.[^/.]+$/, "")}_photo_${scan.photos.length + 1}`,
        corners: newCorners,
        flagged: false,
        flag_reasons: []
      };

      scan.photos.push(newPhoto);
      selectedPhotoIdx = scan.photos.length - 1;
      draw();
      renderScanList();
      showToast('➕ Added new photo crop');
    }

    function deleteSelectedCrop() {
      if (!currentScanName || selectedPhotoIdx < 0) return;
      saveStateToHistory();
      const scan = manifestData.scans[currentScanName];
      scan.photos.splice(selectedPhotoIdx, 1);
      selectedPhotoIdx = -1;
      draw();
      renderScanList();
      showToast('🗑️ Deleted crop polygon');
    }

    async function saveJsonOnly() {
      showToast('💾 Saving JSON manifest...');
      try {
        const res = await fetch('/api/save_manifest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(manifestData)
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('✅ Saved crops_manifest.json!');
        } else {
          showToast('❌ Error: ' + data.message);
        }
      } catch (err) {
        showToast('❌ Save failed: ' + err.message);
      }
    }

    async function exportDebugOverlays() {
      showToast('🖼️ Exporting debug overlays...');
      try {
        const res = await fetch('/api/export_debug', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(manifestData)
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('✅ Exported debug overlays to ScanOldPhotosDebug!');
        } else {
          showToast('❌ Error: ' + data.message);
        }
      } catch (err) {
        showToast('❌ Export failed: ' + err.message);
      }
    }

    async function saveAndRecrop() {
      showToast('✂️ Saving manifest and re-cropping photos...');
      try {
        const res = await fetch('/api/recrop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(manifestData)
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast('✅ All photos successfully cropped!');
        } else {
          showToast('❌ Error: ' + data.message);
        }
      } catch (err) {
        showToast('❌ Re-crop failed: ' + err.message);
      }
    }

    async function autoRotateAll() {
      showToast('🤖 Running auto-orientation classification & rotation...');
      try {
        const res = await fetch('/api/auto_rotate_all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast(`✅ ${data.message}`);
          await loadManifest();
          updateInfoCard();
        } else {
          showToast('❌ Auto-rotate error: ' + data.message);
        }
      } catch (err) {
        showToast('❌ Auto-rotate failed: ' + err.message);
      }
    }

    async function rotateSelectedPhoto(deg) {
      if (selectedPhotoIdx < 0 || !currentScanName) return;
      const photo = manifestData.scans[currentScanName].photos[selectedPhotoIdx];
      showToast(`🔄 Rotating ${photo.id} by ${deg}°...`);
      try {
        const res = await fetch('/api/rotate_photo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ photo_id: photo.id, angle: deg })
        });
        const data = await res.json();
        if (data.status === 'success') {
          showToast(`✅ ${data.message}`);
          await loadManifest();
          updateInfoCard();
        } else {
          showToast('❌ Rotation error: ' + data.message);
        }
      } catch (err) {
        showToast('❌ Rotation failed: ' + err.message);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    loadManifest();
  </script>
</body>
</html>
